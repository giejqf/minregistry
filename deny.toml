# cargo-deny configuration. CI runs `cargo deny check licenses`: every
# dependency must be compatible with Apache-2.0 (no GPL/AGPL/LGPL/SSPL…).

[graph]
all-features = false

[licenses]
confidence-threshold = 0.9
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "BSL-1.0",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[advisories]
yanked = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
